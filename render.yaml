services:
  - type: web
    name: ghostlink
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build && npm install @modelcontextprotocol/server-github --no-save --include=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: OPENAI_BASE_URL
        value: https://api.deepseek.com/v1
      - key: OPENAI_MODEL
        value: deepseek-chat
      - key: OPENAI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
